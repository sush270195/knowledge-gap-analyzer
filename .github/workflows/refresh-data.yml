name: Refresh OrgCS Data

on:
  schedule:
    - cron: '0 0 * * 1'   # Every Monday at midnight UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live data from OrgCS
        env:
          SF_ACCESS_TOKEN: ${{ secrets.SF_ACCESS_TOKEN }}
          SF_INSTANCE_URL: https://orgcs.my.salesforce.com
          SF_API_VERSION: v61.0
        run: node fetch-data.js

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: refresh OrgCS data $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
